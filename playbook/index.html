<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1b20;--mute:#625d68;--line:#e4dfd8;--acc:#5b3fd1;--fix:#b3261e;--miss:#b45309;--conf:#1d5fb4;--ok:#1b7a43}
@media (prefers-color-scheme:dark){:root{--bg:#141217;--card:#1e1b22;--ink:#f1eef4;--mute:#a9a3b1;--line:#34303a;--acc:#a78bfa;--fix:#ff8a80;--miss:#fbbf6a;--conf:#8ab4ff;--ok:#6ddc9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:980px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.9rem;margin:0}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;white-space:nowrap;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:1.2rem;margin:20px 0 8px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.prog{color:var(--mute);font-size:.85rem;margin:4px 0 12px}
.row{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row.done{opacity:.55}
.row input{width:22px;height:22px;margin-top:2px}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.t-FIX{color:var(--fix)}.t-MISSING{color:var(--miss)}.t-CONFIRM{color:var(--conf)}.t-OK{color:var(--ok)}
.what{font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:2px 10px;margin-top:6px;font-size:.92rem}
.kv b{color:var(--mute);font-weight:600}
.src{color:var(--mute);font-size:.8rem;margin-top:6px}
a{color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
@media print{nav{display:none}.panel{display:block!important;break-before:page}body{background:#fff;color:#000}}
.panel{display:none}.panel.on{display:block}
</style>
</head>

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function link(s){ return esc(s).replace(/(https?:\/\/[^\s)]+)/g, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; }); }

function rows(key, list){
  var done = list.filter(function(r,i){ return store[key+i]; }).length;
  var h = '<p class="prog" id="prog-'+key+'">'+done+' of '+list.length+' checked</p>';
  list.forEach(function(r,i){
    var id = key+i, on = !!store[id];
    h += '<div class="row'+(on?' done':'')+'"><input type="checkbox" data-id="'+id+'" data-key="'+key+'" aria-label="Checked"'+(on?' checked':'')+'><div>' +
      '<div class="top"><span class="tag t-'+r.s+'">'+STATUS[r.s]+'</span><span class="what">'+esc(r.what)+'</span></div>' +
      '<div class="kv">' + (r.email?'<b>Email says</b><span>'+link(r.email)+'</span>':'') + (r.app?'<b>App says</b><span>'+link(r.app)+'</span>':'') + (r.act?'<b>Do</b><span>'+link(r.act)+'</span>':'') + '</div>' +
      (r.src?'<div class="src">Source: '+esc(r.src)+'</div>':'') + '</div></div>';
  });
  return h;
}

function show(k){
  cur = k;
  document.getElementById("main").innerHTML = PANELS[k]();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){ b.setAttribute("aria-selected", b.dataset.k === k ? "true" : "false"); });
  try { history.replaceState(null, "", "#" + k); } catch(e){}
  window.scrollTo(0, 0);
}
document.getElementById("tabs").innerHTML = TABS.map(function(t){ return '<button role="tab" data-k="'+t[0]+'">'+t[1]+'</button>'; }).join("");
document.getElementById("tabs").addEventListener("click", function(e){ var b = e.target.closest("button"); if (b) show(b.dataset.k); });
document.getElementById("main").addEventListener("change", function(e){
  var c = e.target; if (!c.dataset.id) return;
  if (c.checked) store[c.dataset.id] = 1; else delete store[c.dataset.id];
  save();
  c.closest(".row").classList.toggle("done", c.checked);
  var key = c.dataset.key, n = document.querySelectorAll('input[data-key="'+key+'"]:checked').length, tot = document.querySelectorAll('input[data-key="'+key+'"]').length;
  var p = document.getElementById("prog-"+key); if (p) p.textContent = n + " of " + tot + " checked";
});
var h0 = (location.hash || "").slice(1); show(PANELS[h0] ? h0 : "first");
</script>
</body>
