<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Martha SF Trip Kit</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Martha">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b2b45; --coral:#f9655b; --purple:#6658ea; --yellow:#f5c070; --paper:#f4f1ea;
  --ink:#1b2b45; --muted:#5d6a80; --card:#ffffff; --line:#ddd6c8; --ok:#1f8a5b;
  --bg:#f4f1ea;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:18px;line-height:1.45;padding-bottom:96px}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:flex;align-items:center}
#login .box{background:var(--card);border-radius:20px;padding:28px 22px;width:100%;box-shadow:0 8px 30px rgba(27,43,69,.12)}
#login h1{font-size:30px;margin-bottom:6px}
#login p{margin:0 0 18px;color:var(--muted)}
input[type=password],input[type=url],input[type=text],textarea{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:18px}
input:focus,textarea:focus{outline:3px solid var(--purple);outline-offset:1px;border-color:var(--purple)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:18px}
.btn.coral{background:var(--coral);color:#fff}
.btn.purple{background:var(--purple)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:44px;padding:8px 14px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.5}
.err{color:var(--coral);font-weight:600;min-height:1.4em;margin-top:10px}

/* top bar */
header.top{position:sticky;top:0;z-index:5;background:#ffffff;color:var(--navy);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:19px;color:var(--navy)}
#status{font-size:14px;font-weight:700;padding:6px 10px;border-radius:99px;background:#ece8dd;color:var(--navy);white-space:nowrap}
#status.ok{background:#d6f0e2;color:#10603b}
#status.wait{background:var(--yellow);color:var(--navy)}
#status.off{background:#fde0dd;color:#a1241a}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 8px}
nav.tabs button{background:none;border:0;padding:8px 2px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;min-height:52px}
nav.tabs button .i{display:block;font-size:20px;line-height:1.1}
nav.tabs button[aria-selected=true]{background:#e6e2fb;color:var(--navy);box-shadow:inset 0 3px 0 var(--purple)}

section.pane{padding-top:16px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(27,43,69,.07);border:1px solid var(--line)}
.lbl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.now{background:#fff4d9;color:var(--ink);border:2px solid var(--yellow)}
.now .lbl{color:#8a5a00}
.now h2{font-size:28px;line-height:1.15;margin-bottom:6px}
.now .when{font-weight:700;color:#4b3bc4;margin-bottom:8px}
.now p{margin:6px 0}
.now .meta{color:var(--muted)}
.next{border-left:8px solid var(--coral)}
.next h3{font-size:22px;line-height:1.2}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.conf{display:inline-flex;align-items:center;gap:8px;background:rgba(245,192,112,.25);border-radius:10px;padding:6px 10px;font-weight:800;letter-spacing:.06em}
.now .conf{background:rgba(245,192,112,.4);color:var(--navy)}
.panic{background:var(--yellow);color:var(--navy);border:0;font-weight:700}
.panic .lbl{color:var(--navy);opacity:.7}

.day{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;margin:22px 0 10px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ev .t{font-weight:800;min-width:78px}
.ev .t small{display:block;font-weight:600;color:var(--muted)}
.ev h3{font-size:19px;margin-bottom:2px}
.ev p{margin:2px 0;color:var(--muted);font-size:16px}
.ev.done{opacity:.55}
.ev.done h3{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);margin-bottom:4px;border:1px solid var(--line)}
.tag.flight{background:var(--purple);color:#fff;border-color:var(--purple)}
.tag.pitch,.tag.rehearsal{background:var(--coral);color:#fff;border-color:var(--coral)}

.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:28px;height:28px;margin:2px 0 0;flex:none;accent-color:var(--coral)}
.chk label{flex:1;cursor:pointer}
.chk small{display:block;color:var(--muted);font-size:15px}
.chk.on label span{text-decoration:line-through;opacity:.6}
.prog{font-weight:700;color:var(--muted);font-size:15px;float:right}

.lk h3{font-size:19px}
.lk p{margin:2px 0 10px;color:var(--muted);font-size:15px}
.lk .f{display:flex;gap:8px}
.lk .f input{flex:1;min-width:0}
.lk .s{font-size:14px;font-weight:700;margin-top:8px;min-height:1.2em}
.s.ok{color:var(--ok)} .s.wait{color:#b7791f} .s.bad{color:var(--coral)}
.lk.focus{outline:4px solid var(--purple)}

.person h3{font-size:20px}
.person p{margin:0;color:var(--muted)}
.facts li{margin:8px 0}
ul.facts{padding-left:20px;margin:0}
textarea{min-height:160px;resize:vertical}
.small{font-size:15px;color:var(--muted)}
footer.fine{text-align:center;color:var(--muted);font-size:14px;margin:20px 0}
.empty{color:var(--muted);font-style:italic}

/* button contrast fix: always readable, even for links and visited links */
a.btn,a.btn:link,a.btn:visited,a.btn:hover,a.btn:active,button.btn{color:#fff!important;-webkit-text-fill-color:#fff}
.btn{background:var(--navy);text-shadow:none}
.btn.purple,a.btn.purple{background:#4b3bc4!important;color:#fff!important}
.btn.coral,a.btn.coral{background:#c9362c!important;color:#fff!important}
.btn.ghost,a.btn.ghost,a.btn.ghost:visited,button.btn.ghost{background:#fff!important;color:var(--navy)!important;-webkit-text-fill-color:var(--navy);border:2px solid var(--navy)!important}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* due badges */
.due{display:inline-block;font-size:13px;font-weight:800;padding:2px 9px;border-radius:99px;background:#ece8dd;color:var(--navy);margin-top:5px}
.due.soon{background:#fde0dd;color:#a1241a}
.due.late{background:#a1241a;color:#fff}
.due.ok{background:#d6f0e2;color:#10603b}
.due.hard{border:2px solid #a1241a}
/* view toggle */
.vbar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.vbar span{font-weight:700;font-size:14px;color:var(--muted)}
.vbar button{min-height:40px;padding:6px 14px;border-radius:99px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:15px;cursor:pointer}
.vbar button[aria-pressed=true]{background:var(--navy);color:#fff}
.v-h{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:12px;align-items:flex-start}
.v-h>*{flex:0 0 88%;scroll-snap-align:center;min-width:0}
.dayg>.card:last-child{margin-bottom:14px}
/* home board */
body.home{padding-bottom:0;overflow:hidden}
body.home footer.fine{display:none}
#p-home{height:calc(100vh - 140px);height:calc(100dvh - 140px);display:flex;flex-direction:column;gap:10px;padding-top:8px;overflow:hidden}
#p-home h2.bt{font-size:20px;margin:0}
#p-home .sub{font-size:14px;color:var(--muted);margin:0}
.board{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0}
.board svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tile{position:relative;z-index:1;margin:6px;border-radius:16px;border:2px solid var(--line);background:#fff;padding:4px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--navy);min-height:0;overflow:hidden;font-family:inherit}
.tile .n{position:absolute;top:3px;left:6px;font-size:11px;font-weight:800;color:var(--muted)}
.tile .e{font-size:clamp(20px,5.5vh,34px);line-height:1}
.tile .d{font-size:12px;font-weight:800;margin-top:2px}
.tile .t{font-size:12px;line-height:1.15;font-weight:700}
.tile.done{background:#d6f0e2;border-color:#9fd6b8}
.tile.done::after{content:"\2713";position:absolute;top:2px;right:6px;font-weight:800;color:#10603b;font-size:14px}
.tile.cur{background:#fff4d9;border:3px solid var(--coral);box-shadow:0 4px 14px rgba(249,101,91,.35)}
.tile.cur .pawn{position:absolute;top:-2px;right:2px;font-size:20px;animation:hop 1.4s ease-in-out infinite}
.tile.sel{outline:3px solid var(--purple);outline-offset:1px}
.tile .tip{display:none}
@media (min-width:760px) and (hover:hover){
  #p-home{overflow:visible}
  .tile{background:none;border:0;box-shadow:none;overflow:visible;padding:0}
  .tile .t,.tile .n{display:none}
  .tile .e{font-size:clamp(40px,9vh,68px)}
  .tile .d{font-size:15px;margin-top:6px}
  .tile.done{background:none}
  .tile.done::after{top:6px;right:calc(50% - 44px)}
  .tile.cur{background:none;border:0;box-shadow:none}
  .tile.cur .e{filter:drop-shadow(0 0 10px rgba(249,101,91,.7));transform:scale(1.12)}
  .tile.cur .d{color:var(--coral)}
  .tile.cur .pawn{right:calc(50% - 46px);top:2px}
  .tile.sel{outline:0}
  .tile.sel .d{text-decoration:underline;text-decoration-color:var(--purple);text-decoration-thickness:3px;text-underline-offset:4px}
  .tile:hover,.tile:focus-visible{z-index:5}
  .tile .tip{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:250px;max-width:80vw;padding:10px 12px;border-radius:14px;background:var(--navy);color:#fff;font-size:13px;line-height:1.35;text-align:left;font-weight:500;box-shadow:0 10px 28px rgba(27,43,69,.35);opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
  .tile .tip b{display:block;font-size:14px;margin-bottom:3px;color:#f5c070}
  .tile[data-col="0"] .tip{left:0;transform:translate(0,-50%) scale(.96)}
  .tile[data-col="2"] .tip{left:auto;right:0;transform:translate(0,-50%) scale(.96)}
  .tile:hover .tip,.tile:focus-visible .tip{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .tile[data-col="0"]:hover .tip,.tile[data-col="0"]:focus-visible .tip,.tile[data-col="2"]:hover .tip,.tile[data-col="2"]:focus-visible .tip{transform:translate(0,-50%) scale(1)}
}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.tile.cur .pawn{animation:none}}
.info{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;flex:none}
.info .lbl{margin-bottom:2px}
.info h3{font-size:18px;margin:0 0 2px}
.info p{margin:2px 0;font-size:15px;color:var(--ink);line-height:1.3}
.info .row{margin-top:8px}

.tip{background:#fff4d9;border-left:6px solid var(--yellow);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:16px;color:var(--ink);line-height:1.3}
.mynote{margin-top:10px}
.mynote textarea{min-height:64px;font-size:16px;padding:10px}
.mynote .row{align-items:center;margin-top:6px}
.tipadmin select,.tipadmin input[type=text]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px;margin-bottom:8px}
.tiprow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tiprow span{flex:1}

.dec{border-left:8px solid var(--purple)}
.dec h3{font-size:19px;line-height:1.25;margin:2px 0 4px}
.dec .opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.decf input[type=text],.decf input[type=url]{margin:4px 0 12px;font-size:16px;padding:10px}
.chk2{display:flex;gap:10px;align-items:center;font-weight:700;margin:8px 0 12px}
.chk2 input{width:26px;height:26px;accent-color:var(--coral);flex:none}

/* floating bags */
.fabs{position:fixed;z-index:7;right:max(12px,calc(50% - 320px + 12px));bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;gap:12px}
body.home .fabs{display:none}
.fab{position:relative;width:60px;height:60px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(27,43,69,.28);cursor:pointer;padding:0}
.fab .bd{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:99px;background:#c9362c;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid #fff}
.fab .bd.ok{background:#10603b}
#bagPanel{position:fixed;inset:0;z-index:9;background:rgba(27,43,69,.45);display:flex;align-items:flex-end;justify-content:center}
#bagPanel .sheet{background:var(--bg);width:100%;max-width:640px;max-height:82vh;max-height:82dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
#bagPanel .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
#bagPanel h2{font-size:24px}
.wxcard{border-left:8px solid #2f7fd1;background:#eaf3ff}
.wxcard h3{font-size:19px;margin:2px 0 4px}
.wxcard ul{margin:6px 0 0;padding-left:20px}
.wxcard li{margin:4px 0}
.wxalert{background:#fde0dd;border:2px solid #a1241a;color:#7a1810;border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:700}
.wxchip{font-family:"Hanken Grotesk",sans-serif;font-size:14px;font-weight:700;color:#1d5fa8;background:#eaf3ff;border-radius:99px;padding:3px 10px;margin-left:8px;white-space:nowrap}
.wxrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.wxrow:first-of-type{border-top:0}
.wxrow b{white-space:nowrap}
.chk label .due{display:table;margin-top:6px}
.prog sup{font-size:inherit}

.wxmap svg{width:100%;height:auto;display:block;background:#f7fbff;border-radius:14px;border:1px solid #cfe0f5}
.pills{display:flex;gap:6px;margin:10px 0}
.pill{flex:1;min-width:0;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:6px 0;font-weight:700;font-size:13px;line-height:1.15;cursor:pointer;min-height:48px}
.pill b{display:block;font-size:18px}
.pill.on{background:var(--navy);color:#fff}
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.tt{border-radius:14px;padding:8px 4px;text-align:center;border:1px solid rgba(27,43,69,.12)}
.tt .ti{font-size:24px;line-height:1}.tt .tl{font-size:13px;font-weight:800}.tt .tm{font-size:12px;color:var(--muted)}.tt .tv{font-size:26px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif}
.uv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0}
.uvh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.uvn{color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:3px 10px}
.uvbar{position:relative;height:10px;border-radius:99px;margin:8px 0;background:linear-gradient(90deg,#2e8b57 0%,#2e8b57 24%,#d9a400 25%,#d9a400 49%,#e07b00 50%,#e07b00 66%,#c9362c 67%,#c9362c 91%,#7a3fc4 92%)}
.uvbar i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:var(--navy);border:2px solid #fff;transform:translateX(-50%)}
.uvs{font-weight:700}
/* packing */
.pksub{display:flex;gap:6px;margin:0 0 12px;background:#ece8dd;border-radius:14px;padding:4px}
.pksub button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--navy);font-weight:800;font-size:15px;cursor:pointer}
.pksub button[aria-pressed=true]{background:var(--navy);color:#fff}
.pkban{border-left:8px solid var(--coral)}
.pkbh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pkcount{text-align:center;font-size:22px}.pkcount b{font-size:30px;font-family:"Bricolage Grotesque",sans-serif}
.pkday h3{font-size:21px;margin-bottom:2px}
.pkev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pkchip{background:#ece8dd;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}
.pkhd{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.pkhd span{font-family:"Hanken Grotesk",sans-serif;font-size:14px;color:var(--muted)}
.pkplus{margin-left:auto;min-height:36px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:99px;font-weight:800;font-size:14px;padding:2px 12px;cursor:pointer}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{position:relative;border:2px solid var(--line);background:#fff;border-radius:16px;min-height:104px}
.pk.on{background:#d6f0e2;border-color:#9fd6b8}
.pk-main{width:100%;height:100%;min-height:104px;background:none;border:0;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--navy);text-align:center}
.pk-ic{font-size:32px;line-height:1}
.pk-nm{font-size:13px;font-weight:700;line-height:1.15;word-break:break-word}
.pk-days{font-size:11px;color:var(--muted);line-height:1.1}
.pk-warn{font-size:11px;font-weight:800;color:#a1241a}
.pk-ed{position:absolute;top:2px;right:2px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:16px;cursor:pointer;color:var(--navy)}

<script>
(function(){
"use strict";

/* ---------- storage helpers (safe) ---------- */
var mem = {};
function lsGet(k){ try { var v = localStorage.getItem(k); return v === null ? (mem[k] || null) : v; } catch(e){ return mem[k] || null; } }
function lsSet(k,v){ mem[k]=v; try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }

var K_TOKEN="tk_token", K_DATA="tk_data", K_QUEUE="tk_queue", K_TAB="tk_tab";
var token = lsGet(K_TOKEN);
var data = null;
var queue = [];
try { queue = JSON.parse(lsGet(K_QUEUE) || "[]"); } catch(e){ queue = []; }
try { data = JSON.parse(lsGet(K_DATA) || "null"); } catch(e){ data = null; }
var tab = lsGet(K_TAB) || "home";
var focusLink = null;
var online = true;
var flushing = false;
var lastSync = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function saveQueue(){ lsSet(K_QUEUE, JSON.stringify(queue)); }
function saveData(){ lsSet(K_DATA, JSON.stringify(data)); }

/* ---------- API ---------- */
var EXEC = 'https://script.google.com/macros/s/AKfycbwbl8cS909NK1aWe3FpHoMDSYnCukQXw7flEEPW-bLJalcS9X8cyyQlXgu2mUGp8hz3/exec';
function api(body, useToken){
  var a = body && body.action;
  var req = {}; for (var k in body) req[k] = body[k];
  if (useToken !== false && token) req.token = token;
  return fetch(EXEC, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(req)}).then(function(r){
    return r.json().catch(function(){ return {ok:false, error:"bad reply"}; }).then(function(j){
      j._status = (j.error === "login") ? 401 : r.status; return j;
    });
  });
}

function logout(){
  token = null; lsDel(K_TOKEN);
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

/* ---------- login ---------- */
$("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  var btn = $("loginBtn"); btn.disabled = true; $("loginErr").textContent = "";
  api({action:"login", password:$("pw").value}, false).then(function(j){
    btn.disabled = false;
    if (j.ok && j.token){
      token = j.token; lsSet(K_TOKEN, token); $("pw").value = "";
      start();
    } else if (j._status === 401 || j.error === "password"){
      $("loginErr").textContent = "That password is not right. Try again.";
    } else {
      $("loginErr").textContent = "No signal. Try again.";
    }
  }).catch(function(){ btn.disabled = false; $("loginErr").textContent = "No signal. Try again."; });
});
$("logout").addEventListener("click", function(e){ e.preventDefault(); if (confirm("Log out? Your saved data stays in the Sheet.")) { lsDel(K_DATA); data = null; logout(); } });

/* ---------- data load / sync ---------- */
function applyQueue(){
  if (!data) return;
  queue.forEach(function(op){
    if (op.action === "setDone"){ var t = (data.timeline||[]).find(function(x){return x.id===op.id;}); if (t) t.done = op.value ? "yes" : ""; }
    if (op.action === "setCheck"){ var c = (data.checklist||[]).find(function(x){return x.id===op.id;}); if (c) c.checked = op.value ? "yes" : ""; }
    if (op.action === "setLink"){ var l = (data.links||[]).find(function(x){return x.key===op.key;}); if (l) { l.url = op.url; l._local = true; } }
    if (op.action === "setNote"){
      var n = (data.notes||[]).find(function(x){return x.key===op.key;});
      if (n) n.value = op.value; else (data.notes = data.notes||[]).push({key:op.key, value:op.value});
    }
  });
}

function setStatus(){
  var el = $("status");
  el.className = "";
  if (queue.length){ el.textContent = "Waiting to save (" + queue.length + ")"; el.className = "wait"; }
  else if (!online){ el.textContent = "Offline. Showing saved copy."; el.className = "off"; }
  else { el.textContent = "Saved to Sheet"; el.className = "ok"; }
}

function refresh(){
  if (!token) return Promise.resolve();
  return api({action:"getAll"}).then(function(j){
    if (j._status === 401 && j.error === "login"){ logout(); return; }
    if (j.ok){
      online = true;
      data = {timeline:j.timeline, checklist:j.checklist, links:j.links, contacts:j.contacts, notes:j.notes};
      lastSync = Date.now(); fetchWxIfStale();
      applyQueue(); saveData();
    } else { online = false; }
    setStatus(); render();
  }).catch(function(){ online = false; setStatus(); });
}

function enqueue(op){
  var key = op.action + "|" + (op.id || op.key);
  queue = queue.filter(function(q){ return (q.action + "|" + (q.id || q.key)) !== key; });
  queue.push(op); saveQueue(); setStatus(); flush();
}

function flush(){
  if (flushing || !queue.length || !token) return Promise.resolve();
  flushing = true;
  function next(){
    if (!queue.length){ flushing = false; setStatus(); render(); return Promise.resolve(); }
    var op = queue[0];
    return api(op).then(function(j){
      if (j._status === 401 && j.error === "login"){ flushing = false; logout(); return; }
      if (j.ok){
        queue.shift(); saveQueue(); online = true; setStatus();
        if (op.action === "setLink"){ var l = (data.links||[]).find(function(x){return x.key===op.key;}); if (l){ l._local = false; l.updated = j.updated || ""; } saveData(); updateLinkStatus(op.key); }
        return next();
      }
      flushing = false; setStatus(); updateAllLinkStatus();
    }).catch(function(){ flushing = false; online = false; setStatus(); updateAllLinkStatus(); });
  }
  return next();
}

/* ---------- time helpers ---------- */
function startMs(ev){ return new Date(ev.start_iso).getTime(); }

function suggestFor(ds, items){

  if (ds === "2026-10-11") add("Hotel booking saved offline", "backpack", "🏨");
  if (indoor) add("Sweater for cold halls", "backpack", "🧥");
  if (ds === "2026-10-12") add("Badge pickup ID", "backpack", "🪪");
  if (ds === "2026-10-13"){ add("Pitch deck backup on USB", "backpack", "💾"); add("Safety pins and lint roller", "backpack", "🧷"); }
  if (ds === "2026-10-14"){ add("Overnight kit for LA", "backpack", "🧴"); add("Change of clothes for LA", "backpack", "👕"); }
  if (ds === "2026-10-15"){ add("Neck pillow and eye mask", "backpack", "😴"); add("Warm layer for the red-eye", "backpack", "🧥"); }
  if (d){

    if (d.uv != null && d.uv >= 6) add("Sunglasses", "wear", "🕶️");

  }

    if (s.existing){ var ex = pkById(s.existing); if (ex){ if (ex.days !== "all" && ex.days.indexOf(pkDay) < 0) ex.days = ex.days.concat([pkDay]); pkSave(ex); } }

  }
  /* edit panel */

    pkReadEdit(); pkEdit.draft.bag = t.getAttribute("data-editbag");

    return true;
  }

    Array.prototype.forEach.call(t.parentNode.querySelectorAll("button"), function(b){ var v = b.getAttribute("data-editday"); b.setAttribute("aria-pressed", String(v === "all" ? d.days === "all" : (d.days !== "all" && d.days.indexOf(v) >= 0))); });

    else { var cur = pkById(pkEdit.id); if (cur){ cur.item = dr.item; cur.note = dr.note; cur.bag = dr.bag; cur.days = dr.days; cur.emoji = dr.emoji; pkSave(cur); } }
    pkEdit = null; renderPkEdit(); render(); return true;
  }
  if (e.target.closest("[data-editdel]")){

    pkEdit = null; renderPkEdit(); render(); return true;
  }

  if (e.target.closest("[data-rvopen]")){ openBag = null; rvOpen = true; rvStep = 0; renderBag(); renderReview(); return true; }
  if (e.target.closest("[data-rvclose]")){ rvOpen = false; renderReview(); return true; }
  if ((t = e.target.closest("[data-rvnav]"))){ rvStep = Math.max(0, Math.min(RVSTEPS.length - 1, rvStep + parseInt(t.getAttribute("data-rvnav"), 10))); renderReview(); var rb = $("rvPanel"); if (rb) rb.scrollTop = 0; return true; }
  if ((t = e.target.closest("[data-rvtoggle]"))){

    rvSave(dn); renderReview(); updateFabs(); renderPack(); return true;
  }
  if ((t = e.target.closest("[data-rvadd]"))){
    var nm2 = ($("rvName").value || "").trim(); if (!nm2){ $("rvName").focus(); return true; }

    else pkNew(rs.s.item, rs.s.bag, [rs.ds], rs.s.emoji);
    renderReview(); updateFabs(); renderPack(); return true;
  }
  if (e.target.closest("[data-rvreset]")){ rvSave({}); rvStep = 0; renderReview(); return true; }
  if (e.target.closest("[data-rvfinish]")){ setNoteLocal("pk_reviewed", new Date().toISOString()); rvOpen = false; renderReview(); render(); return true; }
  return false;
}

    var hz = document.querySelector("#p-" + tab + " .v-h"), best = 0;

      Array.prototype.forEach.call(groups, function(g, i){ var r = g.getBoundingClientRect(); var dd = Math.abs(r.left + r.width / 2 - cx); if (dd < bd){ bd = dd; best = i; } });

      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 6) best = groups.length - 1;

var MOSCONE = "37.7840,-122.4010", SFO_XY = "37.6213,-122.3790", LAX_XY = "33.9416,-118.4085", COURTYARD = "6161 W Century Blvd, Los Angeles, CA 90045";

var rtPending = {};

function legFor(ev){
  var id = ev.id, w = String(ev.where || "");
  if (/moscone/i.test(w)) return {type:"arrive", from:hotelAddr(), to:MOSCONE, needHotel:true, label:"hotel to Moscone West"};
  if (id === "t13") return {type:"info", from:hotelAddr(), to:SFO_XY, needHotel:true, label:"hotel to SFO"};

function rtKey(f, t, m){ return m + "|" + f + "|" + t; }

  api({action:"route", from:f, to:t, mode:m}).then(function(j){
    delete rtPending[k];
    if (j && j.ok){ rt[k] = {minutes:j.minutes, miles:j.miles}; lsSet(VP + "rt", JSON.stringify(rt)); render(); }
    else { rt[k] = {err:true}; }
  }).catch(function(){ delete rtPending[k]; });

}

function fmtLocal(ms, ev){
  var m = /([+-])(\d\d):(\d\d)$/.exec(ev.start_iso || ""); var off = m ? (m[1] === "-" ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3], 10)) : 0;
  var d = new Date(ms + off * 60000), h = d.getUTCHours(), mi = ("0" + d.getUTCMinutes()).slice(-2), ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;
  return h + ":" + mi + " " + ap;
}

  }
  var m = (L.type === "info" && L.label.indexOf("LAX") === 0) || L.type === "info" ? (L.needHotel || /LAX/.test(L.label) ? "ride" : mode) : mode;
  if (L.type === "info") m = "ride";

  if ((t = e.target.closest("[data-deltip]"))){ setNoteLocal(t.getAttribute("data-deltip"), ""); render(); return; }
  if ((t = e.target.closest("[data-view]"))){
    lsSet(VP + t.getAttribute("data-view"), t.getAttribute("data-mode")); var act = document.activeElement; if (act && act.blur) act.blur(); render(); return;
  }
  if ((t = e.target.closest("[data-stage]"))){ selStage = parseInt(t.getAttribute("data-stage"), 10); renderHome(); return; }
  if ((t = e.target.closest("[data-go]"))){ showTab(t.getAttribute("data-go")); return; }
  if ((t = e.target.closest("[data-done]"))){
    var id = t.getAttribute("data-done"); var ev = (data.timeline||[]).find(function(x){ return x.id === id; });
    if (ev){ var nv = !isDone(ev); ev.done = nv ? "yes" : ""; saveData(); enqueue({action:"setDone", id:id, value:nv}); render(); }
    return;
  }
  if ((t = e.target.closest("[data-addlink]"))){
    focusLink = t.getAttribute("data-addlink"); showTab("links"); renderLinks(); return;
  }
  if ((t = e.target.closest("[data-lkedit]"))){
    var lt = document.getElementById("lk_" + t.getAttribute("data-lkedit"));
    if (lt){ lt.classList.toggle("open"); if (lt.classList.contains("open")){ var li = lt.querySelector("input"); if (li) li.focus(); } }
    return;
  }
  if ((t = e.target.closest("[data-savelink]"))){
    var key = t.getAttribute("data-savelink");
    var inp = document.querySelector('[data-urlfor="' + key + '"]'); var url = (inp.value || "").trim();
    if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
    var l = linkByKey(key); if (l){ l.url = url; l._local = true; saveData(); }
    enqueue({action:"setLink", key:key, url:url});
    updateLinkStatus(key);
    renderLinks();
    return;
  }
  if ((t = e.target.closest("[data-copy]"))){
    var v = t.getAttribute("data-copy");
    try { navigator.clipboard.writeText(v); t.style.outline = "3px solid #1f8a5b"; setTimeout(function(){ t.style.outline = ""; }, 900); } catch(x){}
    return;
  }
  if (e.target.id === "saveNotes"){
    var val = $("myNotes").value;
    var n = (data.notes||[]).find(function(x){ return x.key === "martha_notes"; });
    if (n) n.value = val; else (data.notes = data.notes||[]).push({key:"martha_notes", value:val});
    saveData(); enqueue({action:"setNote", key:"martha_notes", value:val});
    $("notesStatus").textContent = navigator.onLine ? "Saving..." : "Saved on this phone. It will go to the Sheet when you have signal.";
    setTimeout(function(){ var s = $("notesStatus"); if (s) s.textContent = queue.length ? "Waiting for signal." : "Saved to the Sheet."; }, 1500);
  }
});

document.addEventListener("change", function(e){
  if (e.target && e.target.id === "peekRange"){ setPreview(parseInt(e.target.value, 10)); return; }
  var dc = e.target.closest && e.target.closest("[data-deccheck]");
  if (dc){ var pr2 = dc.getAttribute("data-deccheck").split("|"); setNoteLocal("dec|" + pr2[0] + "|" + pr2[1], dc.checked ? "yes" : ""); return; }
  var c = e.target.closest && e.target.closest("[data-check]");
  if (c){
    var id = c.getAttribute("data-check"); var it = (data.checklist||[]).find(function(x){ return x.id === id; });
    if (it){ it.checked = c.checked ? "yes" : ""; saveData(); enqueue({action:"setCheck", id:id, value:c.checked}); renderPack(); renderBag(); }
  }
});

window.addEventListener("online", function(){ online = true; flush().then(refresh); });
window.addEventListener("offline", function(){ online = false; setStatus(); });
document.addEventListener("visibilitychange", function(){ if (!document.hidden){ flush().then(refresh); render(); } });
setInterval(function(){ if (!document.hidden){ if (queue.length) flush(); else refresh(); } }, 120000);
setInterval(function(){ var ae = document.activeElement; var typing = ae && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName); if (!document.hidden && data && !typing) { renderNow(); renderHome(); } }, 30000);

/* ---------- start ---------- */
function start(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  if (data){ applyQueue(); render(); }
  setStatus();
  flush().then(refresh);
}

if ("serviceWorker" in navigator){ try { navigator.serviceWorker.register("/sw.js"); } catch(e){} }
if (token){ start(); } else {
  api({action:"login", password:""}, false).then(function(j){
    if (j.ok && j.token){ token = j.token; lsSet(K_TOKEN, token); start(); }
    else { $("login").classList.remove("hidden"); }
  }).catch(function(){ $("login").classList.remove("hidden"); });
}
})();
</script>
</body>
</html>
